<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Barobe Diackel — Association Maouloud 2026</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#123B2F">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#FBF8F1; --paper-raised:#FFFFFF; --ink:#22302B; --ink-soft:#5B6D63;
    --primary:#1F5C4A; --primary-dark:#123B2F; --primary-soft:#E4EEE7;
    --accent:#C98A2C; --accent-soft:#F3E3C0;
    --danger:#B54A3D; --danger-soft:#F4DFDA;
    --line:#E4DCC8;
    --shadow: 0 1px 2px rgba(34,48,43,0.06), 0 6px 20px rgba(34,48,43,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
  #app{max-width:1120px;margin:0 auto;padding:20px 16px 64px;}

  .masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:25px;letter-spacing:-0.01em;margin:0 0 4px;color:var(--primary-dark);}
  .masthead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--accent);font-weight:700;margin-bottom:6px;}
  .masthead p.sub{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow);}

  .role-toggle{display:flex;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow);flex-shrink:0;}
  .role-toggle button{border:none;background:transparent;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);font-family:inherit;transition:all .15s;}
  .role-toggle button.active{background:var(--primary);color:#fff;}
  .role-toggle button:not(.active):hover{background:var(--primary-soft);color:var(--primary-dark);}

  /* Top module nav */
  .mainnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
  .mainnav .navbtn{flex:0 0 auto;padding:9px 14px;border-radius:10px;background:var(--paper-raised);border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .mainnav .navbtn.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}
  .mainnav .navbtn:not(.active):hover{background:var(--primary-soft);color:var(--primary-dark);}

  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;}
  .panel h2{font-family:'Fraunces',serif;font-size:19px;margin:0 0 4px;color:var(--primary-dark);}
  .panel .lede{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
  .section-gap{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}

  /* Sub tabs (cotisations by category) */
  .subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;}
  .subtab{flex:0 0 auto;padding:8px 13px;border-radius:9px 9px 0 0;background:var(--paper);border:1px solid var(--line);border-bottom:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);position:relative;top:1px;}
  .subtab.active{color:var(--primary-dark);box-shadow:0 -2px 0 var(--accent) inset;background:var(--paper-raised);}
  .subtab .n{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);font-size:9.5px;margin-right:5px;font-weight:700;}
  .subpanel{border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:14px;background:var(--paper-raised);}

  .cat-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .cat-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0;color:var(--primary-dark);}
  .cat-head .base-amount{font-size:11.5px;color:var(--ink-soft);}
  .cat-stats{display:flex;gap:12px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .cat-stats b{color:var(--ink);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap input{width:100%;padding:9px 12px 9px 32px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-family:inherit;background:var(--paper);}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.45;}
  select.filter{padding:9px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:var(--paper);font-family:inherit;color:var(--ink);}
  .btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);}
  .btn:hover{background:var(--primary-soft);}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.ghost{border-color:transparent;color:var(--ink-soft);}
  .btn.danger-ghost{border-color:transparent;color:var(--danger);font-size:12px;padding:5px 9px;}
  .btn.sm{padding:6px 10px;font-size:12px;}

  .mlist{display:flex;flex-direction:column;gap:8px;}
  .mrow{display:grid;grid-template-columns:28px 1.6fr 1fr 1fr 1fr 90px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);}
  .mrow .idx{color:var(--ink-soft);font-size:12px;}
  .mrow .name{font-weight:600;font-size:13.5px;}
  .mrow .cat-badge{display:inline-block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .mrow .field .l{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:2px;}
  .mrow .field .v{font-size:13.5px;}
  .mrow input[type=number], .mrow input[type=text]{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;justify-self:end;}
  .badge.paid{background:var(--primary-soft);color:var(--primary-dark);}
  .badge.partial{background:var(--accent-soft);color:#7A5518;}
  .badge.unpaid{background:var(--danger-soft);color:var(--danger);}
  .badge.pos{background:var(--primary-soft);color:var(--primary-dark);}
  .badge.neg{background:var(--danger-soft);color:var(--danger);}
  .badge.zero{background:#EEE9DC;color:var(--ink-soft);}
  .obs{grid-column:1 / -1;font-size:11.5px;color:var(--ink-soft);padding-left:38px;margin-top:-4px;}
  .empty{padding:36px 12px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .addform{display:none;gap:10px;flex-wrap:wrap;margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--paper);}
  .addform.open{display:flex;}
  .addform input, .addform select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-family:inherit;}
  .addform input[type=text]{flex:1;min-width:130px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow);z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .note{font-size:12px;color:var(--ink-soft);margin-top:18px;line-height:1.6;}
  .note b{color:var(--ink);}

  /* Dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .kpi-card{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border-radius:14px;padding:16px;}
  .kpi-card.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
  .kpi-card .v{font-size:21px;font-weight:700;}
  .kpi-card .l{font-size:11px;opacity:0.85;margin-top:3px;text-transform:uppercase;letter-spacing:0.06em;}
  .kpi-card.alt .l{opacity:0.65;}
  .gauge{height:8px;background:rgba(34,48,43,0.1);border-radius:99px;overflow:hidden;margin-top:14px;}
  .gauge-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}
  .gauge.on-dark{background:rgba(255,255,255,0.22);}

  .synth-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .synth-table tr{border-bottom:1px solid var(--line);}
  .synth-table td{padding:9px 4px;}
  .synth-table td.lbl{color:var(--ink-soft);}
  .synth-table td.val{text-align:right;}
  .synth-table tr.total td{font-weight:700;color:var(--primary-dark);border-top:2px solid var(--primary-dark);border-bottom:none;padding-top:12px;}
  .synth-table tr.solde td{font-weight:700;color:var(--accent);font-size:15px;}
  .synth-table input[type=number]{width:130px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;}

  .self-lookup{background:var(--primary-soft);border-radius:12px;padding:16px;margin-bottom:20px;}
  .self-lookup h3{margin:0 0 10px;font-family:'Fraunces',serif;font-size:15px;color:var(--primary-dark);}
  .self-result{margin-top:12px;background:#fff;border-radius:10px;padding:12px;}

  /* Encaissement */
  .enc-search{position:relative;margin-bottom:16px;}
  .enc-search input{width:100%;padding:14px 14px 14px 40px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;font-family:inherit;}
  .enc-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.4;}
  .enc-results{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .enc-result{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--paper);}
  .enc-result:hover{background:var(--primary-soft);}
  .enc-result .n{font-weight:600;font-size:13.5px;}
  .enc-result .c{font-size:11px;color:var(--ink-soft);}
  .receipt{background:var(--paper);border:1.5px solid var(--primary);border-radius:14px;padding:18px;margin-bottom:16px;}
  .receipt-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .receipt-head .n{font-family:'Fraunces',serif;font-size:18px;color:var(--primary-dark);}
  .receipt-head .c{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .receipt-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
  .receipt-grid .l{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:3px;}
  .receipt-grid .v{font-size:16px;}
  .receipt-input{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .receipt-input .fld{flex:1;min-width:160px;}
  .receipt-input label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .receipt-input input{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--line);font-size:16px;font-family:'IBM Plex Mono',monospace;}
  .session-log{margin-top:20px;}
  .session-log h4{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:0 0 8px;}
  .log-item{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);}
  .log-item .t{color:var(--ink-soft);font-size:11px;}

  /* Bus */
  .bus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .bus-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);}
  .bus-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .bus-card-head .n{font-family:'Fraunces',serif;font-size:15px;color:var(--primary-dark);}
  .bus-card-head .cap{font-size:11.5px;color:var(--ink-soft);}
  .occ-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 10px;}
  .occ-fill{height:100%;background:var(--primary);}
  .occ-fill.over{background:var(--danger);}
  .voy-list{display:flex;flex-direction:column;gap:5px;max-height:180px;overflow-y:auto;}
  .voy-item{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);}
  .voy-item .tag{font-size:9.5px;padding:2px 6px;border-radius:99px;background:var(--primary-soft);color:var(--primary-dark);font-weight:700;}
  .voy-item .tag.nonmember{background:var(--accent-soft);color:#7A5518;}

  @media (max-width:640px){
    .mrow{grid-template-columns:1fr 1fr;}
    .mrow.cot{grid-template-areas:"name name" "attendu verse" "reste badge";}
    .mrow .idx{display:none;}
    .mrow.cot .name{grid-area:name;}
    .mrow.cot .field.f-attendu{grid-area:attendu;}
    .mrow.cot .field.f-verse{grid-area:verse;}
    .mrow.cot .field.f-reste{grid-area:reste;}
    .mrow.cot .badge{grid-area:badge;justify-self:start;}
    .badge{justify-self:start;}
    .obs{padding-left:0;}
    .masthead{flex-direction:column;}
    .receipt-grid{grid-template-columns:1fr 1fr;}
  }

  #printArea{display:none;}
  .print-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  .print-table th,.print-table td{border:1px solid #999;padding:6px 8px;font-size:12px;text-align:left;}
  .print-table th{background:#eee;}
  .print-header h1{font-family:Georgia,serif;font-size:20px;margin:0 0 4px;}
  .print-header .meta{font-size:12px;color:#555;margin-bottom:4px;}
  .print-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .print-header img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .print-header .print-header-text{flex:1;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:0 16px;}
    .print-page{page-break-after:always;}
    .print-page:last-child{page-break-after:auto;}
  }
</style>
</head>

<div id="printArea"></div>

/* ---------- Permissions par module (comptes collecteur) ----------
   Un compte admin a toujours accès à tout. Un compte consultation n'a
   jamais accès en écriture. Un compte collecteur avec une liste de
   permissions vide est non restreint (comportement historique) ; avec
   une liste non vide, seuls les modules cochés sont accessibles. */
const GATED_MODULES = ['encaissement','cotisations','mobilemoney','bonnesvolontes','ziar','depenses','bus'];
const MODULE_LABELS = {
  encaissement:'Encaissement', cotisations:'Cotisations', mobilemoney:'Wave / Orange Money',
  bonnesvolontes:'Bonnes volontés', ziar:'Ziar', depenses:'Dépenses', bus:'Bus & voyageurs'
};
const STORAGE_KEY_LABELS = {
  'maouloud2026-members':'Cotisations', 'maouloud2026-mobilemoney':'Wave / Orange Money',
  'maouloud2026-bonnesvolontes':'Bonnes volontés', 'maouloud2026-donsnature':'Dons en nature',
  'maouloud2026-depenses':'Dépenses', 'maouloud2026-buses':'Bus', 'maouloud2026-voyageurs':'Voyageurs',
  'maouloud2026-synthese':'Tableau de bord', 'maouloud2026-bustransport':'Transport bus', 'maouloud2026-ziar':'Ziar'
};
function hasModulePermission(moduleKey){
  if(!GATED_MODULES.includes(moduleKey)) return true;
  if(!currentUser) return false;
  if(currentUser.account_role === 'admin') return true;
  if(currentUser.account_role === 'consultation') return false;
  const perms = currentUser.permissions || [];
  if(perms.length === 0) return true;
  return perms.includes(moduleKey);
}

function fmt(n){ return (n||0).toLocaleString('fr-FR'); }
function statusOf(m){ if(m.montant_verse<=0) return 'unpaid'; if(m.montant_verse>=m.montant_attendu) return 'paid'; return 'partial'; }

/* ---------- Export Excel ---------- */
function exportExcel(filename, sheetsDef){
  try{
    const wb = XLSX.utils.book_new();
    sheetsDef.forEach(sd=>{
      const data = [sd.headers, ...sd.rows];
      const ws = XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, sd.name.slice(0,31));
    });
    XLSX.writeFile(wb, filename);
    showToast('Export Excel généré');
  }catch(e){ showToast("Erreur lors de l'export Excel"); }
}

async function loadKey(name, seed){
  try{
    const res = await fetch('/api/store/'+STORAGE_KEYS[name]);
    if(res.ok){ const j = await res.json(); return JSON.parse(j.value); }
  }catch(e){}
  return JSON.parse(JSON.stringify(seed));
}
async function saveKey(name, value, toast=true){
  try{
    const res = await fetch('/api/store/'+STORAGE_KEYS[name], {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({value: JSON.stringify(value)})
    });
    if(!res.ok){
      if(res.status===401){ showToast('Session expirée — reconnectez-vous'); currentUser=null; role='membre'; render(); return; }
      throw new Error('save failed');
    }
    if(toast) showToast('Enregistré');
  }catch(e){ showToast("Erreur d'enregistrement"); }
}
let saveTimers = {};
function saveKeyDebounced(name, value){
  clearTimeout(saveTimers[name]);
  saveTimers[name] = setTimeout(()=>saveKey(name, value), 500);
}

/* ---------- Aggregates ---------- */
function globalCotisStats(){
  let attendu=0, verse=0, paid=0, partial=0, unpaid=0;
  members.forEach(m=>{
    attendu += m.montant_attendu; verse += m.montant_verse;
    const s = statusOf(m);
    if(s==='paid') paid++; else if(s==='partial') partial++; else unpaid++;
  });
  const rate = attendu>0 ? Math.round((verse/attendu)*100) : 0;
  return {attendu, verse, reste: Math.max(attendu-verse,0), rate, paid, partial, unpaid, count: members.length};
}
function catStats(catKey){
  const list = members.filter(m=>m.categorie===catKey);
  let attendu=0, verse=0;
  list.forEach(m=>{attendu+=m.montant_attendu; verse+=m.montant_verse;});
  const rate = attendu>0 ? Math.round((verse/attendu)*100) : 0;
  return {attendu, verse, count:list.length, rate};
}
function mmTotal(){ return mobilemoney.reduce((a,x)=>a+x.montant,0); }
function bvTotal(){ return bonnesvolontes.reduce((a,x)=>a+x.montant,0); }
function ziarTotal(){ return ziar.reduce((a,x)=>a+x.montant,0); }
function depTotal(){ return depenses.reduce((a,x)=>a+x.avance,0); }
function depJustifieTotal(){ return depenses.reduce((a,x)=>a+x.justifie,0); }

function synthLines(){
  const gs = globalCotisStats();
  const totalCotis = gs.verse + mmTotal();
  const totalCotisBV = totalCotis + bvTotal();
  const totalCaisse = (synthese.report_caisse||0) + totalCotisBV;
  const totalDep = depTotal();
  const solde = totalCaisse - totalDep;
  return {gs, totalCotis, bv:bvTotal(), totalCotisBV, totalCaisse, totalDep, solde};
}

const APP_NAME = 'Barobe Diackel';

function render(){
  const app = document.getElementById('app');

  /* Authentification obligatoire pour accéder à la plateforme, kiosque ou non —
     aucune consultation anonyme n'est possible. Un compte "Consultation" existe
     pour ceux qui n'ont besoin que d'un accès en lecture nominatif. */
  if(!currentUser){
    app.innerHTML = `
      <div class="masthead">
        <div class="brand">
          <img src="/logo-barobe.png" alt="${APP_NAME}" class="brand-logo"/>
          <div>
            <div class="eyebrow">${APP_NAME}${kioskMode ? ' · Poste dédié' : ''}</div>
            <h1>Connexion requise</h1>
          </div>
        </div>
      </div>
      <div class="panel" style="max-width:380px;margin:30px auto 0;text-align:center;">
        <img src="/logo-barobe.png" alt="${APP_NAME}" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;"/>
        <h2>Connexion</h2>
        <p class="lede">${kioskMode ? "Ce poste est réservé — connectez-vous avec votre compte pour continuer." : "Identifiant et mot de passe fournis par le comité."}</p>
        <div class="addform open" style="margin-top:4px;">
          <input type="text" id="login-username" placeholder="Nom d'utilisateur" autocomplete="username"/>
          <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password"/>
          <button class="btn primary" id="loginSubmitBtn" style="width:100%;">Connexion</button>
        </div>
      </div>
    `;
    const submit = async ()=>{
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if(!username || !password){ showToast("Nom d'utilisateur et mot de passe requis"); return; }
      const res = await apiLogin(username, password);
      if(!res){ showToast('Identifiants incorrects'); return; }
      currentUser = {username: res.username, display_name: res.display_name, is_admin: res.role==='admin', account_role: res.role, permissions: res.permissions||[]};
      role = (res.role==='admin' || res.role==='collecteur') ? 'comite' : 'membre';
      await loadAll();
      render();
    };
    document.getElementById('loginSubmitBtn').onclick = submit;
    document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    return;
  }

  /* Mode kiosque : le compte connecté doit avoir la permission du module assigné à ce poste. */
  if(kioskMode && !hasModulePermission(mainTab)){
    const label = (MAIN_TABS.find(t=>t.key===mainTab)||{}).label || mainTab;
    app.innerHTML = `
      <div class="masthead">
        <div class="brand">
          <img src="/logo-barobe.png" alt="${APP_NAME}" class="brand-logo"/>
          <div>
            <div class="eyebrow">${APP_NAME} · Poste dédié</div>
            <h1>Accès refusé</h1>
            <p class="sub">Le compte ${currentUser.display_name} n'a pas accès au module « ${label} ».</p>
          </div>
        </div>
        <div class="role-toggle" style="align-items:center;gap:4px;">
          <button id="logoutBtn">Déconnexion</button>
        </div>
      </div>
      <div class="panel"><p class="lede">Demandez à un administrateur d'ajouter ce module aux permissions de ce compte, ou connectez-vous avec le bon compte.</p></div>
    `;
    document.getElementById('logoutBtn').onclick = async ()=>{ await apiLogout(); currentUser=null; role='membre'; render(); };
    return;
  }

  const gs = globalCotisStats();
  const isAdmin = !!(currentUser && currentUser.is_admin);
  const visibleTabs = MAIN_TABS.filter(t=>t.roles.includes(role) && (!t.adminOnly || isAdmin) && (role!=='comite' || hasModulePermission(t.key)));
  const tabDef = MAIN_TABS.find(t=>t.key===mainTab);
  if(!tabDef){
    mainTab = kioskMode && desiredKioskTab ? desiredKioskTab : 'dashboard';
  }else if(!kioskMode && !visibleTabs.find(t=>t.key===mainTab)){
    mainTab = 'dashboard';
  }
  const activeTabDef = MAIN_TABS.find(t=>t.key===mainTab) || MAIN_TABS[0];

  app.innerHTML = `
    <div class="masthead">
      <div class="brand">
        <img src="/logo-barobe.png" alt="${APP_NAME}" class="brand-logo"/>
        <div>
          <div class="eyebrow">${APP_NAME}${kioskMode ? ' · Poste dédié' : ''}</div>
          <h1>${kioskMode ? activeTabDef.label : APP_NAME}</h1>
          <p class="sub">${gs.count} membres · ${buses.length} bus · Connecté : ${currentUser.display_name}${currentUser.account_role==='admin'?' (admin)':currentUser.account_role==='consultation'?' (consultation)':''}</p>
        </div>
      </div>
      <div class="role-toggle" style="align-items:center;gap:4px;">
        <button id="logoutBtn">Déconnexion</button>
      </div>
    </div>
    <div class="mainnav" id="mainnav"></div>
    <div id="panel"></div>
  `;

  const nav = document.getElementById('mainnav');
  if(kioskMode){
    nav.innerHTML = `<div class="navbtn active" style="cursor:default;">${activeTabDef.label}</div>`;
  }else{
    nav.innerHTML = visibleTabs.map(t=>`<div class="navbtn ${mainTab===t.key?'active':''}" data-tab="${t.key}">${t.label}</div>`).join('');
    nav.querySelectorAll('.navbtn').forEach(el=>{ el.onclick = ()=>{ mainTab = el.dataset.tab; encSelectedId=null; render(); }; });
  }

  document.getElementById('logoutBtn').onclick = async ()=>{
    await apiLogout();
    currentUser = null; role = 'membre';
    if(!kioskMode) mainTab = 'dashboard';
    render();
  };

  const panel = document.getElementById('panel');
  if(activeTabDef.adminOnly && !isAdmin){
    panel.innerHTML = `<div class="panel"><h2>${activeTabDef.label}</h2><p class="lede">Accès réservé aux administrateurs.</p></div>`;
    return;
  }
  if(role==='comite' && !hasModulePermission(mainTab)){
    panel.innerHTML = `<div class="panel"><h2>${activeTabDef.label}</h2><p class="lede">Votre compte n'a pas la permission d'accéder à ce module. Contactez un administrateur.</p></div>`;
    return;
  }
  if(mainTab==='dashboard') renderDashboard(panel);
  else if(mainTab==='encaissement') renderEncaissement(panel);
  else if(mainTab==='cotisations') renderCotisationsModule(panel);
  else if(mainTab==='mobilemoney') renderMobileMoney(panel);
  else if(mainTab==='bonnesvolontes') renderBonnesVolontes(panel);
  else if(mainTab==='ziar') renderZiar(panel);
  else if(mainTab==='depenses') renderDepenses(panel);
  else if(mainTab==='bus') renderBus(panel);
  else if(mainTab==='comptes') renderComptes(panel);
}

function renderSelfLookup(){
  let resultHtml = '';
  if(dashLookupQuery.trim().length>1){
    const q = dashLookupQuery.trim().toLowerCase();
    const matches = members.filter(m=>(m.prenom+' '+m.nom).toLowerCase().includes(q)).slice(0,5);
    if(matches.length===0){
      resultHtml = `<div class="self-result">Aucun membre trouvé pour « ${dashLookupQuery} ».</div>`;
    }else{
      resultHtml = matches.map(m=>{
        const cat = CATEGORIES.find(c=>c.key===m.categorie);
        const reste = Math.max(m.montant_attendu-m.montant_verse,0);
        const st = statusOf(m);
        const myBus = voyageurs.find(v=>v.est_membre && v.membre_id===m.id);
        const busName = myBus ? (buses.find(b=>b.id===myBus.bus_id)||{}).nom : null;
        return `<div class="self-result">
          <div style="font-weight:700;font-size:14px;">${m.prenom} ${m.nom}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">${cat?cat.label:''}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;">
            <span>Attendu : <b class="num">${fmt(m.montant_attendu)}</b></span>
            <span>Versé : <b class="num">${fmt(m.montant_verse)}</b></span>
            <span>Reste : <b class="num">${fmt(reste)}</b></span>
            <span class="badge ${st}">${st==='paid'?'Payé':st==='partial'?'Partiel':'Non payé'}</span>
          </div>
          ${busName ? `<div style="margin-top:8px;font-size:12.5px;">Bus : <b>${busName}</b></div>` : ''}
        </div>`;
      }).join('');
    }
  }
  return `
    <div class="self-lookup">
      <h3>Rechercher mon statut</h3>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="dashLookup" placeholder="Tapez votre nom..." value="${dashLookupQuery}"/>
      </div>
      ${resultHtml}
    </div>
  `;
}

/* ---------- Encaissement (cashier — category-blind search) ---------- */
function renderEncaissement(panel){
  let resultsHtml = '';
  if(encQuery.trim().length>0 && encSelectedId===null){
    const q = encQuery.trim().toLowerCase();
    const matches = members.filter(m=>(m.prenom+' '+m.nom).toLowerCase().includes(q)).slice(0,10);
    resultsHtml = matches.length===0
      ? `<div class="empty">Aucun membre trouvé.</div>`
      : `<div class="enc-results">${matches.map(m=>{
          const reste = Math.max(m.montant_attendu-m.montant_verse,0);
          return `<div class="enc-result" data-id="${m.id}">
            <div><div class="n">${m.prenom} ${m.nom}</div><div class="c">${statusOf(m)==='paid'?'Déjà à jour':'Reste '+fmt(reste)+' FCFA'}</div></div>
            <span class="badge ${statusOf(m)}">${statusOf(m)==='paid'?'Payé':statusOf(m)==='partial'?'Partiel':'Non payé'}</span>
          </div>`;
        }).join('')}</div>`;
  }

  let receiptHtml = '';
  const sel = encSelectedId!==null ? members.find(m=>m.id===encSelectedId) : null;
  if(sel){
    const cat = CATEGORIES.find(c=>c.key===sel.categorie);
    const reste = Math.max(sel.montant_attendu-sel.montant_verse,0);
    receiptHtml = `
      <div class="receipt">
        <div class="receipt-head">
          <div><div class="n">${sel.prenom} ${sel.nom}</div><div class="c">${cat?cat.label:''} · ${fmt(cat?cat.base:0)} FCFA de base</div></div>
          <button class="btn ghost sm" id="encCancel">Fermer</button>
        </div>
        <div class="receipt-grid">
          <div><div class="l">Attendu</div><div class="v num">${fmt(sel.montant_attendu)}</div></div>
          <div><div class="l">Déjà versé</div><div class="v num">${fmt(sel.montant_verse)}</div></div>
          <div><div class="l">Reste</div><div class="v num">${fmt(reste)}</div></div>
        </div>
        <div class="receipt-input">
          <div class="fld"><label>Montant reçu maintenant (FCFA)</label><input type="number" id="encAmount" min="0" placeholder="0"/></div>
          <div class="fld"><label>Téléphone (pour SMS/WhatsApp)</label><input type="tel" id="encPhone" placeholder="77 000 00 00" value="${sel.telephone||''}"/></div>
          <button class="btn primary" id="encSave">Enregistrer</button>
        </div>
      </div>
    `;
  }

  panel.innerHTML = `
    <div class="panel">
      <h2>Encaissement</h2>
      <p class="lede">Recherchez un membre par son nom — la catégorie est retrouvée automatiquement, pas besoin de la connaître à l'avance.</p>
      <div class="enc-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="encInput" placeholder="Nom du membre..." value="${encQuery}" autocomplete="off"/>
      </div>
      ${receiptHtml || resultsHtml}
      <div class="session-log">
        <h4>Encaissements de cette session</h4>
        ${sessionLog.length===0 ? `<div class="empty">Aucun encaissement enregistré pour l'instant.</div>` :
          sessionLog.slice().reverse().map(l=>`<div class="log-item"><span>${l.nom} — <b class="num">${fmt(l.montant)}</b> FCFA</span><span class="t">${l.time}</span></div>`).join('')}
      </div>
    </div>
  `;

  const input = document.getElementById('encInput');
  input.oninput = (e)=>{ encQuery = e.target.value; encSelectedId=null; renderEncaissement(panel);
    const el = document.getElementById('encInput'); el.focus(); el.setSelectionRange(encQuery.length, encQuery.length); };

  panel.querySelectorAll('.enc-result').forEach(el=>{
    el.onclick = ()=>{ encSelectedId = parseInt(el.dataset.id); renderEncaissement(panel); };
  });
  const cancelBtn = document.getElementById('encCancel');
  if(cancelBtn) cancelBtn.onclick = ()=>{ encSelectedId=null; encQuery=''; renderEncaissement(panel); };
  const saveBtn = document.getElementById('encSave');
  if(saveBtn) saveBtn.onclick = ()=>{
    const m = members.find(x=>x.id===encSelectedId);
    const amtInput = document.getElementById('encAmount');
    const phoneInput = document.getElementById('encPhone');
    const phone = phoneInput.value.trim();
    let amt = parseInt(amtInput.value);
    const hasAmt = !isNaN(amt) && amt>0;
    const phoneChanged = phone !== (m.telephone||'');
    if(!hasAmt && !phoneChanged){ showToast('Entrez un montant à encaisser'); return; }
    if(hasAmt) m.montant_verse += amt;
    if(phoneChanged) m.telephone = phone;
    saveKey('members', members, true);
    if(hasAmt) sessionLog.push({nom:`${m.prenom} ${m.nom}`, montant:amt, time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
    showToast(hasAmt ? 'Versement enregistré' : 'Téléphone mis à jour');
    encSelectedId=null; encQuery='';
    renderEncaissement(panel);
  };
}

function busOccupants(busId){ return voyageurs.filter(v=>v.bus_id===busId); }
function formatDateFr(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function normalizePhone(raw){
  if(!raw) return '';
  let p = raw.replace(/[^\d+]/g,'');
  if(p.startsWith('00')) p = '+'+p.slice(2);
  if(!p.startsWith('+')){
    if(/^7\d{8}$/.test(p)) p = '221'+p;          // local Senegalese mobile, no leading 0
    else if(/^221\d{9}$/.test(p)) p = p;          // already has country code
    else p = p.replace(/^\+/,'');
  } else {
    p = p.slice(1);
  }
  return p;
}
function busWhatsAppLink(v, b){
  const phone = normalizePhone(v.telephone);
  if(!phone) return null;
  const dateLabel = busTransport.date_depart ? formatDateFr(busTransport.date_depart) : 'date à confirmer';
  const msg = `Bonjour ${v.nom}, vous êtes inscrit(e) sur ${b.nom} pour le Maouloud 2026 à Barobé Diackel. Départ : ${busTransport.depart} → ${busTransport.destination}, le ${dateLabel}. Merci d'arriver 30 minutes avant le départ.`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
}

          <div class="voy-item" style="flex-wrap:wrap;gap:6px;">
            <span>${v.nom}</span>
            <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span class="tag ${v.est_membre?'':'nonmember'}">${v.est_membre?'Membre':'Non-membre'}</span>
              ${role==='comite'
                ? `<input type="tel" class="voy-phone-input" data-voyphone="${v.id}" placeholder="Téléphone" value="${v.telephone||''}" style="width:118px;padding:4px 7px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-family:inherit;"/>`
                : (v.telephone ? `<span class="cat-badge">${v.telephone}</span>` : '')}
              ${waLink ? `<a class="btn sm" href="${waLink}" target="_blank" rel="noopener" style="padding:4px 9px;font-size:11px;background:#25D366;color:#fff;border:none;text-decoration:none;">WhatsApp</a>` : ''}
              ${role==='comite' ? `<button class="btn danger-ghost" data-delvoy="${v.id}">×</button>` : ''}
            </span>
          </div>`;
        }).join('')}
      </div>
      ${role==='comite' ? `
      <div style="margin-top:10px;">
        <button class="btn sm" data-voyopen="${b.id}">${vf.open?'Fermer':'+ Ajouter un voyageur'}</button>
        <div class="addform ${vf.open?'open':''}" style="margin-top:8px;">
          <select data-voytype="${b.id}">
            <option value="member" ${vf.isMember?'selected':''}>Membre de l'association</option>
            <option value="nonmember" ${!vf.isMember?'selected':''}>Non-membre / invité</option>
          </select>
          ${vf.isMember
            ? `<input type="text" data-voymember="${b.id}" placeholder="Rechercher un membre..." value="${vf.memberQuery||''}"/>`
            : `<input type="text" data-voyname="${b.id}" placeholder="Nom du voyageur"/>`}
          <input type="tel" data-voynewphone="${b.id}" placeholder="Téléphone (optionnel)" value="${vf.telephone||''}"/>
          <button class="btn primary sm" data-voysave="${b.id}">Ajouter</button>
        </div>
        ${vf.open && vf.isMember && vf.memberQuery && vf.memberQuery.trim() ? renderVoyMemberResults(b.id, vf) : ''}
      </div>` : ''}
    </div>
  `;
}
function renderVoyMemberResults(busId, vf){
  const q = vf.memberQuery.trim().toLowerCase();
  const matches = members.filter(m=>(m.prenom+' '+m.nom).toLowerCase().includes(q)).slice(0,6);
  if(matches.length===0) return `<div class="empty" style="padding:8px;">Aucun membre trouvé.</div>`;
  return `<div class="enc-results" style="margin-top:6px;">${matches.map(m=>`
    <div class="enc-result" data-voypick="${busId}" data-mid="${m.id}" style="padding:8px 10px;">
      <span class="n" style="font-size:12.5px;">${m.prenom} ${m.nom}</span>
      ${vf.memberId===m.id ? `<span class="badge pos">Sélectionné</span>` : ''}
    </div>`).join('')}</div>`;
}
function wireBusCards(panel){
  panel.querySelectorAll('[data-voyopen]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.voyopen;
      voyForm[id] = voyForm[id] || {open:false, isMember:true, memberQuery:'', memberId:null, telephone:''};
      voyForm[id].open = !voyForm[id].open;
      renderBus(panel);
    };
  });
  panel.querySelectorAll('[data-voytype]').forEach(sel=>{
    sel.onchange = (e)=>{ const id=sel.dataset.voytype; voyForm[id].isMember = e.target.value==='member'; renderBus(panel); };
  });
  panel.querySelectorAll('[data-voymember]').forEach(inp=>{
    inp.oninput = (e)=>{ const id=inp.dataset.voymember; voyForm[id].memberQuery = e.target.value; voyForm[id].memberId=null; renderBus(panel);
      const el = panel.querySelector(`[data-voymember="${id}"]`); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  });
  panel.querySelectorAll('[data-voypick]').forEach(el=>{
    el.onclick = ()=>{
      const id=el.dataset.voypick;
      const mid = parseInt(el.dataset.mid);
      voyForm[id].memberId = mid;
      if(!voyForm[id].telephone){
        const m = members.find(x=>x.id===mid);
        if(m && m.telephone) voyForm[id].telephone = m.telephone;
      }
      renderBus(panel);
    };
  });
  panel.querySelectorAll('[data-voynewphone]').forEach(inp=>{
    inp.onchange = (e)=>{ const id=inp.dataset.voynewphone; voyForm[id].telephone = e.target.value.trim(); };
  });
  panel.querySelectorAll('[data-voysave]').forEach(btn=>{
    btn.onclick = ()=>{
      const busId = parseInt(btn.dataset.voysave);
      const vf = voyForm[busId];
      const phone = (vf.telephone||'').trim();
      const maxId = voyageurs.reduce((a,x)=>Math.max(a,x.id),0);
      if(vf.isMember){
        if(!vf.memberId){ showToast('Sélectionnez un membre dans la liste'); return; }
        const m = members.find(x=>x.id===vf.memberId);
        voyageurs.push({id:maxId+1, bus_id:busId, nom:`${m.prenom} ${m.nom}`, est_membre:true, membre_id:m.id, telephone:phone});
      }else{
        const nameInput = panel.querySelector(`[data-voyname="${busId}"]`);
        const nom = nameInput.value.trim();
        if(!nom){ showToast('Le nom du voyageur est obligatoire'); return; }
        voyageurs.push({id:maxId+1, bus_id:busId, nom, est_membre:false, membre_id:null, telephone:phone});
      }
      voyForm[busId] = {open:false, isMember:true, memberQuery:'', memberId:null, telephone:''};
      saveKey('voyageurs', voyageurs, true);
      renderBus(panel);
    };
  });
  panel.querySelectorAll('[data-voyphone]').forEach(inp=>{
    inp.onchange = (e)=>{
      const v = voyageurs.find(x=>x.id===parseInt(inp.dataset.voyphone));
      v.telephone = e.target.value.trim();
      saveKeyDebounced('voyageurs', voyageurs);
      renderBus(panel);
    };
  });
  panel.querySelectorAll('[data-delvoy]').forEach(btn=>{
    btn.onclick = ()=>{ voyageurs = voyageurs.filter(v=>v.id!==parseInt(btn.dataset.delvoy)); saveKey('voyageurs', voyageurs, true); renderBus(panel); };
  });
}

/* ---------- Comptes (admin) ---------- */
let usersCache = [];
let auditCache = [];
let userAddOpen = false;
let newUserRole = 'collecteur';
let permsEditingUser = null; // username currently showing its permissions editor, or null

async function renderComptes(panel){
  panel.innerHTML = `<div class="panel"><h2>Comptes</h2><p class="lede">Chargement...</p></div>`;
  const [users, audit] = await Promise.all([apiListUsers(), apiAudit()]);
  usersCache = users; auditCache = audit;
  renderComptesContent(panel);
}
function auditLabel(action){
  const map = {login:'Connexion', logout:'Déconnexion', update:'Modification de données', create_user:'Création de compte', delete_user:'Suppression de compte', reset_password:'Réinitialisation de mot de passe', set_permissions:'Modification des modules autorisés'};
  return map[action] || action;
}
function moduleCheckboxes(idPrefix, checkedList){
  const checked = checkedList || [];
  return GATED_MODULES.map(m=>`
    <label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;">
      <input type="checkbox" id="${idPrefix}-${m}" data-module="${m}" ${checked.includes(m)?'checked':''}/> ${MODULE_LABELS[m]}
    </label>`).join('');
}
function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function backupFilenameStamp(){
  return new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
}
function exportFullBackupJSON(){
  const backup = {
    app: 'Barobe Diackel — Maouloud 2026', generated_at: new Date().toISOString(),
    members, mobilemoney, bonnesvolontes, donsnature, ziar, depenses, buses, voyageurs, bustransport: busTransport, synthese
  };
  downloadJSON(`barobe-diackel-sauvegarde-${backupFilenameStamp()}.json`, backup);
  showToast('Sauvegarde JSON téléchargée');
}
function exportFullBackupExcel(){
  const cotisRows = members.map(m=>{
    const cat = CATEGORIES.find(c=>c.key===m.categorie);
    return [cat?cat.label:m.categorie, m.prenom, m.nom||'', m.montant_attendu, m.montant_verse, Math.max(m.montant_attendu-m.montant_verse,0), statusOf(m)==='paid'?'Payé':statusOf(m)==='partial'?'Partiel':'Non payé', m.telephone||''];
  });
  const voyageurRows = [];
  buses.forEach(b=>{ busOccupants(b.id).forEach(v=>{ voyageurRows.push([b.nom, v.nom, v.est_membre?'Membre':'Non-membre', v.telephone||'']); }); });
  exportExcel(`barobe-diackel-sauvegarde-${backupFilenameStamp()}.xlsx`, [
    {name:'Cotisations', headers:['Catégorie','Prénom','Nom','Attendu','Versé','Reste','Statut','Téléphone'], rows:cotisRows},
    {name:'Wave-OM', headers:['Nom','Opérateur','Montant'], rows:mobilemoney.map(x=>[x.nom,x.operateur,x.montant])},
    {name:'Bonnes volontés', headers:['Nom','Montant','Observation'], rows:bonnesvolontes.map(x=>[x.nom,x.montant,x.observation||''])},
    {name:'Dons en nature', headers:['Donateur','Article'], rows:donsnature.map(x=>[x.donateur,x.article])},
    {name:'Ziar', headers:['Nom','Montant','Observation'], rows:ziar.map(x=>[x.nom,x.montant,x.observation||''])},
    {name:'Dépenses', headers:['Libellé','Responsable','Avancé','Justifié','Reliquat'], rows:depenses.map(x=>[x.libelle,x.responsable||'',x.avance,x.justifie,x.avance-x.justifie])},
    {name:'Voyageurs', headers:['Bus','Nom','Statut','Téléphone'], rows:voyageurRows},
  ]);
  showToast('Sauvegarde Excel téléchargée');
}
function renderComptesContent(panel){
  panel.innerHTML = `
    <div class="panel">
      <h2>Comptes</h2>
      <p class="lede">Comptes nominatifs pour le comité, les collecteurs, et la consultation en lecture seule. Connexions et modifications sont tracées dans le journal ci-dessous.</p>

      <div class="section-gap" style="margin-top:0;">
        <h3 style="font-family:'Fraunces',serif;font-size:16px;color:var(--primary-dark);margin:0 0 8px;">Sauvegarde complète</h3>
        <p class="lede" style="margin-bottom:10px;">Les données sont déjà conservées sur le disque du serveur (elles survivent aux redémarrages). Ces boutons vous donnent en plus une copie locale, utile en cas de coupure internet ou pour vérifier hors-ligne. À faire régulièrement le jour de l'événement.</p>
        <div class="toolbar">
          <button class="btn" id="backupExcelBtn">📊 Sauvegarde Excel (tout lire)</button>
          <button class="btn" id="backupJsonBtn">💾 Sauvegarde JSON (restauration exacte)</button>
        </div>
      </div>

      <div class="toolbar"><button class="btn primary" id="userAddBtn">+ Créer un compte</button></div>
      <div class="addform ${userAddOpen?'open':''}" id="userAddForm" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" id="u-username" placeholder="Identifiant (ex. fatou)" style="flex:1;min-width:130px;"/>
          <input type="text" id="u-display" placeholder="Nom affiché (ex. Fatou DIOP)" style="flex:1;min-width:130px;"/>
          <input type="password" id="u-password" placeholder="Mot de passe (4+ caractères)" style="flex:1;min-width:130px;"/>
          <select id="u-role">
            <option value="collecteur" ${newUserRole==='collecteur'?'selected':''}>Collecteur</option>
            <option value="admin" ${newUserRole==='admin'?'selected':''}>Administrateur</option>
            <option value="consultation" ${newUserRole==='consultation'?'selected':''}>Consultation (lecture seule)</option>
          </select>
        </div>
        ${newUserRole==='collecteur' ? `
        <div style="margin-top:10px;">
          <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">Modules autorisés pour ce compte — laisser tout décoché pour un accès complet à la saisie.</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${moduleCheckboxes('newuser', [])}</div>
        </div>` : ''}
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn primary" id="userSaveBtn">Créer</button>
          <button class="btn ghost" id="userCancelBtn">Annuler</button>
        </div>
      </div>
      <div class="mlist" style="margin-top:14px;">
        ${usersCache.map((u,i)=>`
        <div class="mrow" style="grid-template-columns:28px 1.4fr 1fr 1fr 190px;">
          <div class="idx num">${i+1}</div>
          <div class="name">${u.display_name}<div class="cat-badge">@${u.username}</div></div>
          <div class="field"><div class="l">Rôle</div><div class="v">${u.role==='admin'?'Administrateur':u.role==='collecteur'?'Collecteur':'Consultation'}</div>
            ${u.role==='collecteur' ? `<div class="cat-badge">${u.permissions && u.permissions.length ? u.permissions.map(m=>MODULE_LABELS[m]||m).join(', ') : 'Accès complet'}</div>` : ''}
          </div>
          <div class="field"><div class="l">Créé le</div><div class="v" style="font-size:11.5px;">${u.created_at.slice(0,10)}</div></div>
          <div style="display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;">
            ${u.role==='collecteur' ? `<button class="btn sm ghost" data-editperms="${u.username}">Modules</button>` : ''}
            <button class="btn sm ghost" data-resetpw="${u.username}" title="Réinitialiser le mot de passe">Mot de passe</button>
            ${u.username!==currentUser.username ? `<button class="btn danger-ghost" data-deluser="${u.username}">Suppr.</button>` : ''}
          </div>
        </div>
        ${permsEditingUser===u.username ? `
        <div class="addform open" style="flex-direction:column;align-items:stretch;">
          <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">Modules autorisés pour @${u.username} — laisser tout décoché pour un accès complet.</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${moduleCheckboxes('editperm', u.permissions||[])}</div>
          <div style="margin-top:10px;display:flex;gap:8px;">
            <button class="btn primary sm" data-saveperms="${u.username}">Enregistrer</button>
            <button class="btn ghost sm" id="permsCancelBtn">Annuler</button>
          </div>
        </div>` : ''}
        `).join('')}
      </div>

      <div class="section-gap">
        <h3 style="font-family:'Fraunces',serif;font-size:16px;color:var(--primary-dark);margin:0 0 10px;">Journal d'activité</h3>
        <div class="mlist">
          ${auditCache.length===0 ? `<div class="empty">Aucune activité enregistrée.</div>` : auditCache.slice(0,50).map(a=>`
          <div class="log-item" style="flex-direction:column;align-items:stretch;gap:2px;">
            <div style="display:flex;justify-content:space-between;"><span><b>${a.username}</b> — ${auditLabel(a.action)}${a.target?(' · '+(STORAGE_KEY_LABELS[a.target]||a.target)):''}</span><span class="t">${a.at.replace('T',' ').slice(0,16)}</span></div>
            ${a.detail ? `<div style="font-size:11.5px;color:var(--ink-soft);padding-left:2px;">${a.detail}</div>` : ''}
          </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  document.getElementById('backupExcelBtn').onclick = ()=>exportFullBackupExcel();
  document.getElementById('backupJsonBtn').onclick = ()=>exportFullBackupJSON();
  document.getElementById('userAddBtn').onclick = ()=>{ userAddOpen=!userAddOpen; renderComptesContent(panel); };
  const cancel = document.getElementById('userCancelBtn'); if(cancel) cancel.onclick = ()=>{ userAddOpen=false; renderComptesContent(panel); };
  const roleSelEl = document.getElementById('u-role');
  if(roleSelEl) roleSelEl.onchange = (e)=>{ newUserRole = e.target.value; renderComptesContent(panel); };
  const save = document.getElementById('userSaveBtn');
  if(save) save.onclick = async ()=>{
    const username = document.getElementById('u-username').value.trim();
    const display_name = document.getElementById('u-display').value.trim();
    const password = document.getElementById('u-password').value;
    const roleSel = document.getElementById('u-role').value;
    if(!username || !password){ showToast('Identifiant et mot de passe requis'); return; }
    let permissions = [];
    if(roleSel==='collecteur'){
      permissions = GATED_MODULES.filter(m=>{ const el = document.getElementById('newuser-'+m); return el && el.checked; });
    }
    const res = await apiCreateUser({username, display_name, password, role:roleSel, permissions});
    if(!res.ok){ showToast(res.error); return; }
    showToast('Compte créé');
    userAddOpen=false; newUserRole='collecteur';
    usersCache = await apiListUsers();
    renderComptesContent(panel);
  };
  panel.querySelectorAll('[data-deluser]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Supprimer ce compte ?')) return;
      const res = await apiDeleteUser(b.dataset.deluser);
      if(!res.ok){ showToast(res.error); return; }
      usersCache = await apiListUsers();
      renderComptesContent(panel);
    };
  });
  panel.querySelectorAll('[data-resetpw]').forEach(b=>{
    b.onclick = async ()=>{
      const pw = prompt('Nouveau mot de passe pour '+b.dataset.resetpw+' :');
      if(!pw) return;
      const res = await apiResetPassword(b.dataset.resetpw, pw);
      if(!res.ok){ showToast(res.error); return; }
      showToast('Mot de passe réinitialisé');
    };
  });
  panel.querySelectorAll('[data-editperms]').forEach(b=>{
    b.onclick = ()=>{ permsEditingUser = (permsEditingUser===b.dataset.editperms) ? null : b.dataset.editperms; renderComptesContent(panel); };
  });
  const permsCancel = document.getElementById('permsCancelBtn');
  if(permsCancel) permsCancel.onclick = ()=>{ permsEditingUser = null; renderComptesContent(panel); };
  panel.querySelectorAll('[data-saveperms]').forEach(b=>{
    b.onclick = async ()=>{
      const username = b.dataset.saveperms;
      const permissions = GATED_MODULES.filter(m=>{ const el = document.getElementById('editperm-'+m); return el && el.checked; });
      const res = await apiSetPermissions(username, permissions);
      if(!res.ok){ showToast(res.error); return; }
      showToast('Modules mis à jour — le compte devra se reconnecter pour en tenir compte');
      permsEditingUser = null;
      usersCache = await apiListUsers();
      renderComptesContent(panel);
    };
  });
}

(async function init(){
  const me = await apiMe();
  if(me.username){
    currentUser = {username: me.username, display_name: me.display_name, is_admin: me.is_admin, account_role: me.account_role, permissions: me.permissions||[]};
    role = me.role;
    await loadAll();
  }
  render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  }
})();
</script>
